<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masuk — Asisten AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f10;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .box {
    width: 100%;
    max-width: 340px;
    padding: 32px 28px;
    background: #1a1a1c;
    border-radius: 16px;
    border: 1px solid #2a2a2d;
  }
  h1 { color: #f2f2f2; font-size: 20px; margin: 0 0 6px; }
  p { color: #9a9a9e; font-size: 14px; margin: 0 0 20px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333336;
    background: #0f0f10;
    color: #f2f2f2;
    font-size: 15px;
    margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: #6b6bff; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #6b6bff;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    color: #ff6b6b;
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Masuk dulu ya</h1>
    <p>Web ini butuh password. Hubungi pemilik web kalau belum punya.</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Password" autofocus required />
      <button type="submit" id="loginBtn">Masuk</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('passwordInput').value;
      btn.disabled = true;
      errorMsg.textContent = '';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.error || 'Gagal masuk, coba lagi.';
        }
      } catch (err) {
        errorMsg.textContent = 'Gagal menghubungi server.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
